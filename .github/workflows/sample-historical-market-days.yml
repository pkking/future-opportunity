name: Sample Historical Market Days

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Historical strategy (funding-carry or cash-and-carry)
        required: true
        type: choice
        options:
          - funding-carry
          - cash-and-carry
      start_date:
        description: Inclusive UTC calendar start date (YYYY-MM-DD)
        required: true
      end_date:
        description: Inclusive UTC calendar end date (YYYY-MM-DD)
        required: true
      sample_size:
        description: Requested number of market days
        required: true
        default: "30"
      seed:
        description: Stable pre-registration seed
        required: true
      policy_version:
        description: Sampling policy version
        required: true
        default: "systematic-stratified-sha256-v1"
      artifact_name:
        description: Optional unique artifact name for composed workflows
        required: false
        default: ""
  workflow_call:
    inputs:
      strategy:
        required: true
        type: string
      start_date:
        required: true
        type: string
      end_date:
        required: true
        type: string
      sample_size:
        required: true
        type: string
      seed:
        required: true
        type: string
      policy_version:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/sample-historical-market-days.yml"

permissions:
  contents: read

jobs:
  sample:
    name: Produce deterministic market-day sample evidence
    runs-on: ubuntu-latest
    env:
      STRATEGY: ${{ inputs.strategy || 'funding-carry' }}
      START_DATE: ${{ inputs.start_date || '2026-01-01' }}
      END_DATE: ${{ inputs.end_date || '2026-01-31' }}
      SAMPLE_SIZE: ${{ inputs.sample_size || '5' }}
      SAMPLE_SEED: ${{ inputs.seed || 'stage2-baseline-v1' }}
      POLICY_VERSION: ${{ inputs.policy_version || 'systematic-stratified-sha256-v1' }}
      SAMPLE_ARTIFACT_NAME: ${{ inputs.artifact_name || format('historical-market-day-sample-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --all-extras --dev

      - name: Generate pre-registered sample evidence
        run: |
          mkdir -p artifacts/historical-sampling
          uv run python scripts/sample_historical_market_days.py \
            --strategy "${STRATEGY}" \
            --start-date "${START_DATE}" \
            --end-date "${END_DATE}" \
            --sample-size "${SAMPLE_SIZE}" \
            --seed "${SAMPLE_SEED}" \
            --policy-version "${POLICY_VERSION}" \
            --output artifacts/historical-sampling/sample.json
          cat artifacts/historical-sampling/sample.json

      - name: Upload read-only sampling evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAMPLE_ARTIFACT_NAME }}
          path: artifacts/historical-sampling/
          if-no-files-found: warn

  cash-selftest:
    name: Produce Cash sampling self-test evidence
    if: github.event_name == 'push' && inputs.strategy == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --all-extras --dev

      - name: Generate Cash pre-registered sample evidence
        run: |
          mkdir -p artifacts/cash-historical-sampling
          uv run python scripts/sample_historical_market_days.py \
            --strategy "cash-and-carry" \
            --start-date "2026-06-01" \
            --end-date "2026-06-10" \
            --sample-size "3" \
            --seed "cash-stage2-baseline-v1" \
            --policy-version "systematic-stratified-sha256-v1" \
            --output artifacts/cash-historical-sampling/sample.json
          cat artifacts/cash-historical-sampling/sample.json

      - name: Upload Cash sampling self-test evidence
        uses: actions/upload-artifact@v4
        with:
          name: cash-historical-market-day-sample-${{ github.run_id }}
          path: artifacts/cash-historical-sampling/
          if-no-files-found: error
