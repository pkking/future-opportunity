name: Prepare Cash 2025 Quarter Wave

on:
  workflow_dispatch:
    inputs:
      wave:
        description: Frozen Cash 2025 expiry-quarter preparation wave
        required: true
        type: choice
        options:
          - q3
          - q4

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve frozen Cash 2025 quarter wave
    runs-on: ubuntu-latest
    outputs:
      acquisition_json: ${{ steps.resolve.outputs.acquisition_json }}
      acquisition_id: ${{ steps.resolve.outputs.acquisition_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - id: resolve
        name: Verify source-bound 12-day quarter manifest
        env:
          WAVE: ${{ inputs.wave }}
        shell: bash
        run: |
          set -euo pipefail
          case "${WAVE}" in
            q3) manifest="docs/historical-acquisition-plans/cash-2025-q3-12day-wave-001.json" ;;
            q4) manifest="docs/historical-acquisition-plans/cash-2025-q4-12day-wave-001.json" ;;
            *) echo "unsupported wave" >&2; exit 1 ;;
          esac
          mkdir -p artifacts/cash-2025-quarter-wave
          uv run python scripts/resolve_historical_acquisition.py \
            "${manifest}" \
            --output artifacts/cash-2025-quarter-wave/resolved.json \
            --max-funding-days 1 --max-cash-cases 12 --max-total-items 12
          test "$(jq -r '.funding == null' artifacts/cash-2025-quarter-wave/resolved.json)" = "true"
          test "$(jq -r '.cash_cases | length' artifacts/cash-2025-quarter-wave/resolved.json)" = "12"
          test "$(jq -r '.selection_provenance.cash.selection_kind' artifacts/cash-2025-quarter-wave/resolved.json)" = "pre_registered_availability_sample"
          test "$(jq -r '.selection_provenance.cash.source.artifact_id' artifacts/cash-2025-quarter-wave/resolved.json)" = "11539833591"
          test "$(jq -r '.selection_provenance.cash.source.artifact_digest' artifacts/cash-2025-quarter-wave/resolved.json)" = "sha256:f67f1db18609c87e2cea363abf33eff7dc4592d4ab8680019ff6e1a63b206c74"
          cp "${manifest}" artifacts/cash-2025-quarter-wave/operator.json
          compact="$(jq -c . "${manifest}")"
          echo "acquisition_json=${compact}" >> "${GITHUB_OUTPUT}"
          echo "acquisition_id=$(jq -r '.acquisition_id' "${manifest}")" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable control evidence
        uses: actions/upload-artifact@v4
        with:
          name: cash-2025-quarter-control-${{ inputs.wave }}
          path: artifacts/cash-2025-quarter-wave/
          if-no-files-found: error

  acquire:
    name: Prepare frozen Cash 2025 quarter cases
    needs: resolve
    uses: ./.github/workflows/acquire-historical-campaign.yml
    with:
      acquisition_json: ${{ needs.resolve.outputs.acquisition_json }}

  summary:
    name: Audit 12 prepared, 12 compact and 12 actuals artifacts
    needs: [resolve, acquire]
    # Keep the evidence job alive on partial/failed source preparations.
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      WAVE: ${{ inputs.wave }}
      ACQUISITION_RESULT: ${{ needs.acquire.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve exact Actions artifact inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/cash-2025-quarter-audit
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > artifacts/cash-2025-quarter-audit/artifacts.json

      - name: Verify frozen Cash artifact identity and metadata
        shell: bash
        run: |
          set -euo pipefail
          case "${WAVE}" in
            q3) manifest="docs/historical-acquisition-plans/cash-2025-q3-12day-wave-001.json" ;;
            q4) manifest="docs/historical-acquisition-plans/cash-2025-q4-12day-wave-001.json" ;;
            *) echo "unsupported frozen wave: ${WAVE}" >&2; exit 1 ;;
          esac
          python3 scripts/verify_cash_2025_quarter_artifacts.py \
            --manifest "${manifest}" \
            --artifacts artifacts/cash-2025-quarter-audit/artifacts.json \
            --wave "${WAVE}" --run-id "${GITHUB_RUN_ID}" \
            --acquisition-result "${ACQUISITION_RESULT}" \
            --output artifacts/cash-2025-quarter-audit/summary.json
          # The inventory audit is not a promotion gate:
          # corpus_mutation: false; promotion_dispatched: false

      - name: Upload artifact-inventory evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cash-2025-quarter-summary-${{ inputs.wave }}
          path: artifacts/cash-2025-quarter-audit/
          if-no-files-found: error
