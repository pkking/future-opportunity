name: Review Pending Historical Corpus PRs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/review-pending-historical-prs.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Compare main-pinned corpus and open review proposals
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev

      - name: Read pending PR indexes without executing PR branches
        shell: bash
        run: |
          set -euo pipefail
          work="artifacts/pending-corpus-review"
          mkdir -p "${work}/proposals" "${work}/raw"

          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > "${work}/raw/open-prs.json"
          pr_count="$(jq 'length' "${work}/raw/open-prs.json")"
          if [ "${pr_count}" -ge 100 ]; then
            echo "PR list reached one-page bound; refusing incomplete audit" >&2
            exit 1
          fi

          jq -r '.[] | [.number, .head.sha] | @tsv' \
            "${work}/raw/open-prs.json" |
          while IFS=$'\t' read -r pr_number head_sha; do
            [[ "${pr_number}" =~ ^[0-9]+$ ]]
            [[ "${head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]

            files="${work}/raw/pr-${pr_number}-files.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100" \
              > "${files}"
            file_count="$(jq 'length' "${files}")"
            if [ "${file_count}" -ge 100 ]; then
              echo "PR #${pr_number} reached file-list bound; refusing incomplete audit" >&2
              exit 1
            fi

            if ! jq -e \
              'any(.[]; .filename == "tests/fixtures/historical/corpus-index.json")' \
              "${files}" >/dev/null; then
              continue
            fi

            raw_index="${work}/raw/pr-${pr_number}-index.json"
            gh api \
              "repos/${GITHUB_REPOSITORY}/contents/tests/fixtures/historical/corpus-index.json?ref=${head_sha}" \
              | jq -r '.content' | base64 --decode > "${raw_index}"
            jq -e '.schema_version == 1 and (.entries | type == "array")' \
              "${raw_index}" >/dev/null

            jq -n \
              --argjson pr_number "${pr_number}" \
              --arg head_sha "${head_sha}" \
              --slurpfile index "${raw_index}" \
              '{
                pr_number: $pr_number,
                head_sha: $head_sha,
                index: $index[0]
              }' > "${work}/proposals/pr-${pr_number}.json"
          done

      - name: Report pinned versus pending PR union
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/report_pending_corpus_prs.py \
            --base-index tests/fixtures/historical/corpus-index.json \
            --policy tests/e2e/historical-target-policy.json \
            --proposals-dir artifacts/pending-corpus-review/proposals \
            --output artifacts/pending-corpus-review/report.json
          jq '{
            pinned_counts,
            projected_union_counts_if_all_approved,
            conflicting_pending_facts,
            overlaps,
            shared_index_reconciliation_required,
            unmerged_proposals_count_toward_pinned
          }' artifacts/pending-corpus-review/report.json

      - name: Upload PR review identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-historical-corpus-review-${{ github.run_id }}
          path: artifacts/pending-corpus-review/
          if-no-files-found: warn
