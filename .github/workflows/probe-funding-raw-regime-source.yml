name: Probe Funding Raw Regime Source

on:
  workflow_dispatch:
  push:
    paths:
      - "src/future_opportunity/backtest/funding_raw_feature_lineage.py"
      - "scripts/probe_funding_raw_regime_source.py"
      - ".github/workflows/probe-funding-raw-regime-source.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Read-only Funding regime ${{ matrix.window_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        window_id:
          - 2026-09-01-to-07
          - 2026-09-15-to-21
          - 2026-10-01-to-07
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: Capture exact pre-registered window from OKX public endpoints
        run: |
          uv run python scripts/probe_funding_raw_regime_source.py \
            --window-id "${{ matrix.window_id }}" \
            --output-dir "artifacts/funding-raw-regime-source/${{ matrix.window_id }}"
      - name: Report exact source coverage and evidence limitations
        if: always()
        shell: bash
        run: |
          echo "## Retrospective Funding regime: ${{ matrix.window_id }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "artifacts/funding-raw-regime-source/${{ matrix.window_id }}/coverage-summary.json" ]]; then
            jq -r '"Source digest: \(.source_sha256); quota met: \(.quota_fully_met); missing days: \(.missing_days | length)."' \
              "artifacts/funding-raw-regime-source/${{ matrix.window_id }}/coverage-summary.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source incomplete or failed; see error.json. Acquisition prohibited." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Retrospective source only. Historical publication as-of-entry UNVERIFIED; no promotions or economics gate." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload read-only source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-raw-regime-source-${{ matrix.window_id }}
          path: artifacts/funding-raw-regime-source/${{ matrix.window_id }}/
          if-no-files-found: warn
