name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: future_opportunity_test
          POSTGRES_USER: future_opportunity
          POSTGRES_PASSWORD: future_opportunity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U future_opportunity -d future_opportunity_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://future_opportunity:future_opportunity@localhost:5432/future_opportunity_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest
