name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static and architecture safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Architecture and agent contract
        run: uv run pytest tests/test_architecture.py tests/test_agent_contract.py -v

  plan-integrity:
    name: Agent plan integrity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR Issue and active execution plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/validate_agent_plan.py

  code-tests:
    name: Code-level tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: future_opportunity_test
          POSTGRES_USER: future_opportunity
          POSTGRES_PASSWORD: future_opportunity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U future_opportunity -d future_opportunity_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://future_opportunity:future_opportunity@localhost:5432/future_opportunity_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: Domain application adapter and persistence tests
        run: >-
          uv run pytest tests
          --ignore=tests/test_api_smoke.py
          --ignore=tests/e2e
          -v

  api-tests:
    name: API contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: REST and OpenAPI contract
        run: uv run pytest tests/test_api_smoke.py -v

  e2e-strategy:
    name: E2E strategy acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --dev
      - name: Deterministic strategy replay
        env:
          E2E_EVIDENCE_PATH: artifacts/e2e/strategy-evidence.json
        run: |
          mkdir -p artifacts/e2e
          uv run pytest tests/e2e -v \
            --junitxml=artifacts/e2e/junit.xml
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-e2e-evidence
          path: artifacts/e2e/
          if-no-files-found: warn
