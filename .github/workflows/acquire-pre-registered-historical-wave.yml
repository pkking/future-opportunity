name: Acquire Pre-registered Historical Wave

on:
  workflow_dispatch:
    inputs:
      acquisition_id:
        description: Safe acquisition identifier
        required: false
        default: "preregistered-wave-001"
      planner_campaign_prefix:
        description: Future read-only planner prefix
        required: false
        default: "preregistered-review-001"
      funding_sample_run_id:
        description: Exact successful Funding sampling run
        required: false
        default: "37482498880"
      funding_sample_artifact_name:
        description: Exact Funding sampling artifact
        required: false
        default: "historical-market-day-sample-37482498880"
      cash_case_plan_run_id:
        description: Exact successful sampled Cash case-plan run
        required: false
        default: "37490008931"
      cash_case_plan_artifact_name:
        description: Exact sampled Cash case-plan artifact
        required: false
        default: "cash-acquisition-case-plan-37490008931"
  workflow_call:
    inputs:
      acquisition_id:
        required: true
        type: string
      planner_campaign_prefix:
        required: true
        type: string
      funding_sample_run_id:
        required: true
        type: string
      funding_sample_artifact_name:
        required: true
        type: string
      cash_case_plan_run_id:
        required: true
        type: string
      cash_case_plan_artifact_name:
        required: true
        type: string
  push:
    paths:
      - ".github/workflows/acquire-pre-registered-historical-wave.yml"

permissions:
  actions: read
  contents: read

jobs:
  compose:
    name: Compose reviewed pre-registered acquisition
    uses: ./.github/workflows/compose-historical-acquisition.yml
    with:
      acquisition_id: ${{ inputs.acquisition_id || 'preregistered-wave-001' }}
      planner_campaign_prefix: ${{ inputs.planner_campaign_prefix || 'preregistered-review-001' }}
      funding_sample_run_id: ${{ inputs.funding_sample_run_id || '37482498880' }}
      funding_sample_artifact_name: ${{ inputs.funding_sample_artifact_name || 'historical-market-day-sample-37482498880' }}
      cash_case_plan_run_id: ${{ inputs.cash_case_plan_run_id || '37490008931' }}
      cash_case_plan_artifact_name: ${{ inputs.cash_case_plan_artifact_name || 'cash-acquisition-case-plan-37490008931' }}

  acquire:
    name: Prepare reviewed pre-registered market days
    needs: compose
    uses: ./.github/workflows/acquire-historical-campaign.yml
    with:
      acquisition_json: ${{ needs.compose.outputs.acquisition_json }}

  summary:
    name: Verify wave boundary
    needs: [compose, acquire]
    if: always() && needs.compose.result == 'success' && needs.acquire.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: boundary
        name: Derive canonical pre-registered wave boundary
        env:
          ACQUISITION_JSON: ${{ needs.compose.outputs.acquisition_json }}
          ACQUISITION_ID: ${{ needs.compose.outputs.acquisition_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pre-registered-wave
          acquisition=artifacts/pre-registered-wave/acquisition.json
          printf '%s\n' "${ACQUISITION_JSON}" > "${acquisition}"

          test "$(jq -r '.acquisition_id' "${acquisition}")" = "${ACQUISITION_ID}"
          funding_dates="$(jq -c 'if .funding == null then [] else .funding.market_dates end' "${acquisition}")"
          cash_dates="$(jq -c '[.cash_cases[].entry_at[0:10]]' "${acquisition}")"
          expected_funding="$(jq 'length' <<<"${funding_dates}")"
          expected_cash="$(jq 'length' <<<"${cash_dates}")"
          expected_total=$((expected_funding + expected_cash))
          test "${expected_total}" -ge 1
          test "${expected_total}" -le 31

          if [ "${expected_funding}" -gt 0 ]; then
            test "$(jq -r '.selection_provenance.funding.strategy' "${acquisition}")" = "funding-carry"
          fi
          if [ "${expected_cash}" -gt 0 ]; then
            test "$(jq -r '.selection_provenance.cash.strategy' "${acquisition}")" = "cash-and-carry"
          fi

          echo "expected_funding_count=${expected_funding}" >> "${GITHUB_OUTPUT}"
          echo "expected_cash_count=${expected_cash}" >> "${GITHUB_OUTPUT}"
          echo "expected_total_count=${expected_total}" >> "${GITHUB_OUTPUT}"

          jq -n \
            --arg acquisition_id "${ACQUISITION_ID}" \
            --argjson funding_dates "${funding_dates}" \
            --argjson cash_dates "${cash_dates}" \
            --argjson expected_funding_count "${expected_funding}" \
            --argjson expected_cash_count "${expected_cash}" \
            --argjson expected_total_count "${expected_total}" \
            '{
              schema_version: 1,
              evidence_type: "pre_registered_acquisition_wave",
              acquisition_id: $acquisition_id,
              funding_market_dates: $funding_dates,
              cash_entry_market_dates: $cash_dates,
              expected_funding_count: $expected_funding_count,
              expected_cash_count: $expected_cash_count,
              expected_total_count: $expected_total_count,
              corpus_mutation: false
            }' > artifacts/pre-registered-wave/summary.json

          cat artifacts/pre-registered-wave/summary.json

      - name: Assert compact artifact identity matches composed wave
        env:
          EXPECTED_FUNDING_COUNT: ${{ steps.boundary.outputs.expected_funding_count }}
          EXPECTED_CASH_COUNT: ${{ steps.boundary.outputs.expected_cash_count }}
          EXPECTED_TOTAL_COUNT: ${{ steps.boundary.outputs.expected_total_count }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > artifacts/pre-registered-wave/run-artifacts.json

          jq -r \
            '[.artifacts[] | select(.name | contains("-compact-")) | .name] | sort[]' \
            artifacts/pre-registered-wave/run-artifacts.json \
            > artifacts/pre-registered-wave/compact-artifact-names.txt

          total="$(wc -l < artifacts/pre-registered-wave/compact-artifact-names.txt | tr -d ' ')"
          unique="$(sort -u artifacts/pre-registered-wave/compact-artifact-names.txt | wc -l | tr -d ' ')"
          funding="$(grep -c '^okx-btc-funding-compact-' artifacts/pre-registered-wave/compact-artifact-names.txt || true)"
          cash="$(grep -c '^okx-btc-cash-and-carry-compact-' artifacts/pre-registered-wave/compact-artifact-names.txt || true)"

          test "${total}" = "${EXPECTED_TOTAL_COUNT}"
          test "${unique}" = "${EXPECTED_TOTAL_COUNT}"
          test "${funding}" = "${EXPECTED_FUNDING_COUNT}"
          test "${cash}" = "${EXPECTED_CASH_COUNT}"

          jq -n \
            --argjson total "${total}" \
            --argjson unique "${unique}" \
            --argjson funding "${funding}" \
            --argjson cash "${cash}" \
            --argjson expected_total "${EXPECTED_TOTAL_COUNT}" \
            --argjson expected_funding "${EXPECTED_FUNDING_COUNT}" \
            --argjson expected_cash "${EXPECTED_CASH_COUNT}" \
            '{
              schema_version: 1,
              compact_artifact_total: $total,
              compact_artifact_unique_names: $unique,
              funding_compact_count: $funding,
              cash_compact_count: $cash,
              expected_total_count: $expected_total,
              expected_funding_count: $expected_funding,
              expected_cash_count: $expected_cash,
              identity_contract_satisfied: (
                $total == $expected_total and
                $unique == $expected_total and
                $funding == $expected_funding and
                $cash == $expected_cash
              )
            }' > artifacts/pre-registered-wave/artifact-identity.json

          cat artifacts/pre-registered-wave/artifact-identity.json

      - name: Upload pre-registered wave control evidence
        uses: actions/upload-artifact@v4
        with:
          name: pre-registered-acquisition-wave-${{ github.run_id }}
          path: artifacts/pre-registered-wave/
          if-no-files-found: error
