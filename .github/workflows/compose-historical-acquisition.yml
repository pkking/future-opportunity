name: Compose Historical Acquisition Manifest

on:
  workflow_dispatch:
    inputs:
      acquisition_id:
        description: Safe acquisition identifier
        required: true
      planner_campaign_prefix:
        description: Safe read-only planner campaign prefix
        required: true
      funding_start_date:
        description: Optional inclusive Funding UTC start date
        required: false
      funding_end_date:
        description: Optional inclusive Funding UTC end date
        required: false
      funding_sample_run_id:
        description: Optional exact successful historical sampling run ID
        required: false
      funding_sample_artifact_name:
        description: Optional exact historical sampling artifact name
        required: false
      cash_case_plan_run_id:
        description: Optional exact successful Cash case-plan run ID
        required: false
      cash_case_plan_artifact_name:
        description: Optional exact Cash case-plan artifact name
        required: false
  push:
    paths:
      - ".github/workflows/compose-historical-acquisition.yml"

permissions:
  actions: read
  contents: read

jobs:
  compose:
    name: Verify reviewed evidence and compose acquisition JSON
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ACQUISITION_ID: ${{ github.event_name == 'push' && 'selftest-sampled-acquisition' || inputs.acquisition_id }}
      PLANNER_PREFIX: ${{ github.event_name == 'push' && 'selftest-sampled-review' || inputs.planner_campaign_prefix }}
      FUNDING_START_DATE: ${{ inputs.funding_start_date }}
      FUNDING_END_DATE: ${{ inputs.funding_end_date }}
      FUNDING_SAMPLE_RUN_ID: ${{ github.event_name == 'push' && '37482498880' || inputs.funding_sample_run_id }}
      FUNDING_SAMPLE_ARTIFACT_NAME: ${{ github.event_name == 'push' && 'historical-market-day-sample-37482498880' || inputs.funding_sample_artifact_name }}
      CASH_PLAN_RUN_ID: ${{ github.event_name == 'push' && '37477835622' || inputs.cash_case_plan_run_id }}
      CASH_PLAN_ARTIFACT_NAME: ${{ github.event_name == 'push' && 'cash-acquisition-case-plan-37477835622' || inputs.cash_case_plan_artifact_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --all-extras --dev

      - id: funding_source
        name: Verify optional exact Funding sampling artifact
        shell: bash
        run: |
          set -euo pipefail
          work="artifacts/historical-acquisition-composer"
          incoming="${work}/incoming/funding-sample"
          mkdir -p "${incoming}"

          if [ -z "${FUNDING_SAMPLE_RUN_ID}" ] && [ -z "${FUNDING_SAMPLE_ARTIFACT_NAME}" ]; then
            printf '%s\n' '{"funding_sample":null}' > "${work}/funding-source.json"
            echo "selection_path=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -z "${FUNDING_SAMPLE_RUN_ID}" ] || [ -z "${FUNDING_SAMPLE_ARTIFACT_NAME}" ]; then
            echo "funding_sample_run_id and artifact_name must be supplied together" >&2
            exit 1
          fi
          [[ "${FUNDING_SAMPLE_RUN_ID}" =~ ^[0-9]+$ ]]

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FUNDING_SAMPLE_RUN_ID}" \
            > "${work}/funding-source-run.json"
          test "$(jq -r '.status' "${work}/funding-source-run.json")" = "completed"
          test "$(jq -r '.conclusion' "${work}/funding-source-run.json")" = "success"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FUNDING_SAMPLE_RUN_ID}/artifacts?per_page=100" \
            > "${work}/funding-source-artifacts.json"

          count="$(jq --arg name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            '[.artifacts[] | select(.name == $name)] | length' \
            "${work}/funding-source-artifacts.json")"
          test "${count}" = "1"

          artifact_id="$(jq -r --arg name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name) | .id' \
            "${work}/funding-source-artifacts.json")"
          digest="$(jq -r --arg name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name) | .digest' \
            "${work}/funding-source-artifacts.json")"
          expired="$(jq -r --arg name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name) | .expired' \
            "${work}/funding-source-artifacts.json")"

          [[ "${artifact_id}" =~ ^[0-9]+$ ]]
          [[ "${digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          test "${expired}" = "false"

          gh run download "${FUNDING_SAMPLE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            --dir "${incoming}"

          mapfile -t samples < <(
            find "${incoming}" -maxdepth 1 -type f -name sample.json -print
          )
          test "${#samples[@]}" = "1"

          selection="${work}/funding-selection-provenance.json"
          uv run python scripts/build_historical_selection_provenance.py \
            "${samples[0]}" \
            --source-workflow-run "${FUNDING_SAMPLE_RUN_ID}" \
            --artifact-name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            --artifact-id "${artifact_id}" \
            --artifact-digest "${digest}" \
            --output "${selection}"

          jq -n \
            --arg run "${FUNDING_SAMPLE_RUN_ID}" \
            --arg name "${FUNDING_SAMPLE_ARTIFACT_NAME}" \
            --arg artifact_id "${artifact_id}" \
            --arg digest "${digest}" \
            --arg sample "${samples[0]}" \
            '{
              funding_sample: {
                source_workflow_run: $run,
                artifact_name: $name,
                artifact_id: $artifact_id,
                artifact_digest: $digest,
                sample_path: $sample,
                selection_provenance_path: $selection
              }
            }' \
            --arg selection "${selection}" \
            > "${work}/funding-source.json"
          echo "selection_path=${selection}" >> "${GITHUB_OUTPUT}"

      - id: cash_source
        name: Verify optional exact Cash case-plan artifact
        shell: bash
        run: |
          set -euo pipefail
          work="artifacts/historical-acquisition-composer"
          incoming="${work}/incoming/cash-plan"
          mkdir -p "${incoming}"

          if [ -z "${CASH_PLAN_RUN_ID}" ] && [ -z "${CASH_PLAN_ARTIFACT_NAME}" ]; then
            printf '%s\n' '{"cash_case_plan":null}' > "${work}/cash-source.json"
            echo "cash_plan_path=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -z "${CASH_PLAN_RUN_ID}" ] || [ -z "${CASH_PLAN_ARTIFACT_NAME}" ]; then
            echo "cash_case_plan_run_id and artifact_name must be supplied together" >&2
            exit 1
          fi
          [[ "${CASH_PLAN_RUN_ID}" =~ ^[0-9]+$ ]]

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CASH_PLAN_RUN_ID}" \
            > "${work}/cash-source-run.json"
          test "$(jq -r '.status' "${work}/cash-source-run.json")" = "completed"
          test "$(jq -r '.conclusion' "${work}/cash-source-run.json")" = "success"

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${CASH_PLAN_RUN_ID}/artifacts?per_page=100" \
            > "${work}/cash-source-artifacts.json"

          count="$(jq --arg name "${CASH_PLAN_ARTIFACT_NAME}" \
            '[.artifacts[] | select(.name == $name)] | length' \
            "${work}/cash-source-artifacts.json")"
          test "${count}" = "1"

          artifact_id="$(jq -r --arg name "${CASH_PLAN_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name) | .id' \
            "${work}/cash-source-artifacts.json")"
          digest="$(jq -r --arg name "${CASH_PLAN_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name) | .digest' \
            "${work}/cash-source-artifacts.json")"
          expired="$(jq -r --arg name "${CASH_PLAN_ARTIFACT_NAME}" \
            '.artifacts[] | select(.name == $name) | .expired' \
            "${work}/cash-source-artifacts.json")"

          [[ "${artifact_id}" =~ ^[0-9]+$ ]]
          [[ "${digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          test "${expired}" = "false"

          gh run download "${CASH_PLAN_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${CASH_PLAN_ARTIFACT_NAME}" \
            --dir "${incoming}"

          mapfile -t reports < <(
            find "${incoming}" -maxdepth 1 -type f -name report.json -print
          )
          test "${#reports[@]}" = "1"

          jq -n \
            --arg run "${CASH_PLAN_RUN_ID}" \
            --arg name "${CASH_PLAN_ARTIFACT_NAME}" \
            --arg artifact_id "${artifact_id}" \
            --arg digest "${digest}" \
            --arg report "${reports[0]}" \
            '{
              cash_case_plan: {
                source_workflow_run: $run,
                artifact_name: $name,
                artifact_id: $artifact_id,
                artifact_digest: $digest,
                report_path: $report
              }
            }' > "${work}/cash-source.json"
          echo "cash_plan_path=${reports[0]}" >> "${GITHUB_OUTPUT}"

      - name: Compose acquisition-ready dispatch JSON
        shell: bash
        run: |
          set -euo pipefail
          work="artifacts/historical-acquisition-composer"
          args=(
            --acquisition-id "${ACQUISITION_ID}"
            --planner-campaign-prefix "${PLANNER_PREFIX}"
            --output "${work}/acquisition.json"
            --max-total-items 31
          )

          if [ -n "${FUNDING_START_DATE}" ] || [ -n "${FUNDING_END_DATE}" ]; then
            args+=(
              --funding-start-date "${FUNDING_START_DATE}"
              --funding-end-date "${FUNDING_END_DATE}"
            )
          fi

          funding_selection="${{ steps.funding_source.outputs.selection_path }}"
          if [ -n "${funding_selection}" ]; then
            args+=(
              --funding-selection-provenance "${funding_selection}"
            )
          fi

          cash_plan="${{ steps.cash_source.outputs.cash_plan_path }}"
          if [ -n "${cash_plan}" ]; then
            args+=(--cash-case-plan "${cash_plan}")
          fi

          uv run python scripts/compose_historical_acquisition.py "${args[@]}"
          cat "${work}/acquisition.json"

      - name: Upload read-only acquisition composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-acquisition-composer-${{ github.run_id }}
          path: artifacts/historical-acquisition-composer/
          if-no-files-found: warn
