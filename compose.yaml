services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: future_opportunity
      POSTGRES_USER: future_opportunity
      POSTGRES_PASSWORD: future_opportunity
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U future_opportunity -d future_opportunity"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - future-opportunity-postgres:/var/lib/postgresql/data

volumes:
  future-opportunity-postgres:
