apiVersion: arbitrage.dev/v1alpha1
kind: StrategyPlan

metadata:
  name: quickstart-btc-funding

spec:
  strategy:
    name: funding-carry
    version: 1.0.0

  asset:
    base: BTC
    quote: USDT

  venue:
